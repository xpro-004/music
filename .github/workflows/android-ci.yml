name: Android CI

on:
  pull_request:
    branches: [xrotune-android-app]
  push:
    branches: [xrotune-android-app, audit/app-check-play-integrity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Google Services for CI
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "xrotune-ci-placeholder",
              "storage_bucket": "xrotune-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.xrotune.app" }
              },
              "oauth_client": [{
                "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{ "current_key": "ci-placeholder-key" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build debug, run unit tests, and build release
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease --no-daemon
